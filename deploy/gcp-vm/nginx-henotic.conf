# Proxy cache for SSR/ISR HTML responses (prevents Node.js CPU spikes under crawler bursts)
proxy_cache_path /var/cache/nginx/henotic levels=1:2 keys_zone=henotic_cache:100m max_size=10g inactive=24h use_temp_path=off;

# API rate limit zone (10 req/s sustained per IP, burst 25)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Bot shield (mirrors src/proxy.ts: allow search bots, block empty UA and known scrapers)
map $http_user_agent $henotic_bad_bot {
    default 0;
    "" 1;
    ~*(googlebot|bingbot|yandex|baiduspider|duckduckbot|slurp|twitterbot|facebookexternalhit|linkedinbot|applebot|gptbot|claudebot|perplexitybot) 0;
    ~*(bytespider|ccbot|python-requests|aiohttp|scrapy|httpclient|libwww-perl|pyspider|zgrab|masscan) 1;
}

# Cache bypass rules: only cache pure GET/HEAD document requests (never RSC/Flight/Action/Prefetch)
map $request_method $henotic_method_bypass {
    default 1;
    GET     0;
    HEAD    0;
}

map "$henotic_method_bypass$http_rsc$http_next_action$http_next_router_prefetch$http_next_router_state_tree$http_next_url" $henotic_bypass_cache {
    default 1;
    "0"     0;
}

# Restrict cache-refresh bypass headers strictly to loopback / local VM requests
geo $henotic_is_local {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
}

map "$henotic_is_local:$http_x_cache_refresh" $henotic_force_refresh {
    default 0;
    "1:1"   1;
}

map "$henotic_is_local:$http_x_cache_refresh_scheme" $henotic_cache_scheme {
    default   $scheme;
    "1:https" https;
    "1:http"  http;
}

upstream henotic_nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Apex domain -> canonical www 1-hop 301 redirect (preserving ACME challenge path).
# Note: Both this port 80 block and any Certbot-managed port 443 server block for
# henoticdiagnostics.com must redirect in a single hop directly to
# https://www.henoticdiagnostics.com$request_uri (never http://apex -> https://apex -> https://www).
server {
    listen 80;
    listen [::]:80;
    server_name henoticdiagnostics.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.henoticdiagnostics.com$request_uri;
    }
}

# Primary canonical server
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.henoticdiagnostics.com 34.100.203.56;

    client_max_body_size 20M;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # Certbot ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Honeypot trap defense
    location ~* (/_trap|/trap/) {
        return 403;
    }

    # Serve Next.js hashed static assets directly from disk (zero Node.js overhead)
    location /_next/static/ {
        alias /var/www/henotic-diagnostics/current/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Lightweight health check endpoint (no cache, no rate limit, no access log noise)
    location = /api/health {
        proxy_pass http://henotic_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        access_log off;
    }

    # API routes: never cached, rate limited
    location ^~ /api/ {
        limit_req zone=api_limit burst=25 nodelay;
        proxy_pass http://henotic_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Service Worker & standalone public tools must never be proxy-cached
    location = /sw.js {
        proxy_pass http://henotic_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    location ~ ^/(booking-system|seo-image-optimizer)(/|$) {
        proxy_pass http://henotic_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # Main Next.js App Router pages & PSEO matrix
    location / {
        if ($henotic_bad_bot) {
            return 403;
        }

        proxy_pass http://henotic_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache henotic_cache;
        proxy_cache_key "$henotic_cache_scheme$request_method$host$request_uri";
        proxy_cache_bypass $henotic_bypass_cache $henotic_force_refresh;
        proxy_no_cache $henotic_bypass_cache;
        proxy_ignore_headers Cache-Control;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 301 302 1h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }
}

# Loopback-only cache refresh listener (bypasses Certbot port 80 HTTPS redirects so
# Next.js webhook/revalidation calls can overwrite https cache entries immediately)
server {
    listen 127.0.0.1:8081;
    server_name www.henoticdiagnostics.com;

    location / {
        proxy_pass http://henotic_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $henotic_cache_scheme;

        proxy_cache henotic_cache;
        proxy_cache_key "$henotic_cache_scheme$request_method$host$request_uri";
        proxy_cache_bypass $henotic_force_refresh;
        proxy_no_cache 0;
        proxy_ignore_headers Cache-Control;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 301 302 1h;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
