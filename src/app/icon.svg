<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- H letter - Henotic -->
  <text x="256" y="310" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="280" fill="white" letter-spacing="-10">H</text>
  <!-- Medical cross accent -->
  <rect x="216" y="370" width="80" height="16" rx="8" fill="url(#accent)"/>
  <!-- DNA helix dots -->
  <circle cx="170" cy="130" r="12" fill="url(#accent)" opacity="0.7"/>
  <circle cx="342" cy="130" r="12" fill="url(#accent)" opacity="0.7"/>
  <circle cx="170" cy="382" r="8" fill="url(#accent)" opacity="0.5"/>
  <circle cx="342" cy="382" r="8" fill="url(#accent)" opacity="0.5"/>
</svg>