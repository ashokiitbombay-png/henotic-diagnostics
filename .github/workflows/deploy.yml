name: Deploy Henotic Diagnostics to GCP VM

on:
  workflow_run:
    workflows: ["CI — Lint, Typecheck & Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy to GCP VM'
        type: choice
        default: main
        options:
          - main
          - experiment-pseo-routing

concurrency:
  group: deploy-gcp-vm
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_branch || 'main' }}
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          envs: DEPLOY_BRANCH,DEPLOY_SHA
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            APP_DIR="/var/www/henotic-diagnostics"
            cd "$APP_DIR"

            echo "=== Pre-fetch VM disk & inode telemetry ==="
            df -h "$APP_DIR" / || true
            df -Pi "$APP_DIR" / || true
            du -sh "$APP_DIR"/* "$APP_DIR/.next" "$APP_DIR/.live-releases" "$APP_DIR/.git" "$HOME/.npm" /var/cache/nginx/henotic /var/log/pm2 2>/dev/null || true

            # Always reclaim unreferenced build intermediates, npm caches & crashed fetch-pack tmp files before git fetch
            # (Live PM2 workers run from $APP_DIR/current/.next, never from $APP_DIR/.next)
            rm -rf "$APP_DIR/.next" "$HOME/.npm/_cacache" "$HOME/.npm/_logs" 2>/dev/null || true
            rm -f "$APP_DIR/.git/objects/pack/tmp_"* 2>/dev/null || true

            DISK_PCT="$(df -P "$APP_DIR" | awk 'NR==2 {gsub(/%/, "", $5); print $5 + 0}')"
            INODE_PCT="$(df -Pi "$APP_DIR" | awk 'NR==2 {gsub(/%/, "", $5); print $5 + 0}')"
            echo "=== Usage check before fetch: disk=${DISK_PCT}% inodes=${INODE_PCT}% ==="

            if (( DISK_PCT >= 75 || INODE_PCT >= 75 )); then
              echo "⚠️ High disk/inode pressure detected — running zero-tempfile pre-fetch recovery..."
              ACTIVE_RELEASE="$(readlink -f "$APP_DIR/current" 2>/dev/null || true)"

              if [[ -d "$APP_DIR/.live-releases" ]]; then
                for rel in "$APP_DIR/.live-releases"/*/; do
                  [[ -d "$rel" ]] || continue
                  rel_real="$(readlink -f "${rel%/}" 2>/dev/null || true)"
                  if [[ -z "$ACTIVE_RELEASE" || "$rel_real" != "$ACTIVE_RELEASE" ]]; then
                    echo "Removing inactive release: $rel_real"
                    rm -rf "${rel%/}" 2>/dev/null || true
                  fi
                done
              fi

              if [[ -n "$ACTIVE_RELEASE" && -d "$ACTIVE_RELEASE/.next/server/app/services" ]]; then
                echo "Evicting active ISR service cache in-place..."
                find "$ACTIVE_RELEASE/.next/server/app/services" -type f \( \
                  -name '*.prefetch.rsc' -o \
                  -name '*.segment.rsc' -o \
                  -name '*.html' -o \
                  -name '*.rsc' -o \
                  -name '*.meta' -o \
                  -name '*.body' \
                \) -delete 2>/dev/null || true
                find "$ACTIVE_RELEASE/.next/server/app/services" -mindepth 1 -type d -empty -delete 2>/dev/null || true
              fi

              if [[ -d /var/cache/nginx/henotic ]]; then
                find /var/cache/nginx/henotic -type f -delete 2>/dev/null || sudo -n find /var/cache/nginx/henotic -type f -delete 2>/dev/null || true
              fi

              if command -v pm2 >/dev/null 2>&1; then
                pm2 flush 2>/dev/null || true
              fi
              if [[ -d /var/log/pm2 ]]; then
                for lf in /var/log/pm2/*.log; do
                  [[ -f "$lf" ]] && : > "$lf" 2>/dev/null || true
                done
                rm -f /var/log/pm2/*.gz /var/log/pm2/*.log.* 2>/dev/null || true
              fi
              sudo -n journalctl --vacuum-size=100M 2>/dev/null || true
              sudo -n apt-get clean 2>/dev/null || true

              echo "=== Post-recovery VM disk & inode telemetry ==="
              df -h "$APP_DIR" / || true
              df -Pi "$APP_DIR" / || true
            fi

            git fetch --prune origin "$DEPLOY_BRANCH"
            git checkout "$DEPLOY_BRANCH"
            if [ -n "${DEPLOY_SHA:-}" ]; then
              git reset --hard "$DEPLOY_SHA"
            else
              git reset --hard FETCH_HEAD
            fi
            chmod +x deploy/gcp-vm/deploy.sh deploy/gcp-vm/rollback.sh deploy/gcp-vm/prune-isr-cache.sh deploy/gcp-vm/backup-leads.sh
            ./deploy/gcp-vm/deploy.sh
