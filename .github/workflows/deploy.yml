name: Deploy Henotic Diagnostics to GCP VM

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy to GCP VM'
        type: choice
        default: main
        options:
          - main
          - experiment-pseo-routing

concurrency:
  group: deploy-gcp-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || 'main' }}
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          envs: DEPLOY_BRANCH
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /var/www/henotic-diagnostics
            git fetch origin "$DEPLOY_BRANCH"
            git checkout "$DEPLOY_BRANCH"
            git reset --hard FETCH_HEAD
            chmod +x deploy/gcp-vm/deploy.sh deploy/gcp-vm/rollback.sh deploy/gcp-vm/prune-isr-cache.sh
            ./deploy/gcp-vm/deploy.sh
