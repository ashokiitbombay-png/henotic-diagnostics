name: Parallel Matrix Sharded Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-matrix:
    name: Build Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ matrix.shard }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci

      - name: Run Sharded Build (Worker ${{ matrix.shard }}/4)
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          BUILD_SHARD: "${{ matrix.shard }}/4"
          BUILD_SHARD_INDEX: "${{ matrix.shard }}"
          BUILD_SHARD_TOTAL: "4"
          NEXT_PUBLIC_SITE_URL: https://www.henoticdiagnostics.com
          NEXT_PUBLIC_WORDPRESS_API_URL: https://cms.henoticdiagnostics.com/graphql
          WORDPRESS_API_URL: https://cms.henoticdiagnostics.com/graphql

      - name: Upload Shard Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-shard-${{ matrix.shard }}
          path: |
            public/
            .next/standalone
            .next/static
          retention-days: 1

  merge-and-deploy:
    name: Merge Shards & Deploy
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Shard Artifacts
        uses: actions/download-artifact@v4
        with:
          path: shard-artifacts

      - name: Merge Shard Artifacts
        run: |
          mkdir -p public .next
          cp -rn shard-artifacts/next-shard-*/public/* public/ || true
          echo "✅ All sharded build artifacts successfully merged into unified deployment package!"
